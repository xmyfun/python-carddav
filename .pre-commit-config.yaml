repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [src]
        additional_dependencies: [types-requests]

  - repo: local
    hooks:
      - id: vermin
        name: vermin (enforce Python 3.10 floor)
        entry: uv run vermin -t=3.10- --violations src
        language: system
        pass_filenames: false
      - id: pytest-offline
        name: pytest (offline: unit + local test servers)
        # "not remote" == everything except the real servers in servers.ini: unit
        # tests plus the local servers the fixtures launch themselves. Fully
        # offline, so a commit never depends on credentials or network.
        entry: uv run pytest -q -m "not remote"
        language: system
        pass_filenames: false
