name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # Pin the exact interpreter for this matrix entry. Without an explicit
      # choice uv picks the newest available Python (3.15) for every job,
      # which would collapse the whole matrix onto one version.
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv with Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: uv sync --all-extras --dev

      # Mirrors the local `pytest-offline` pre-commit hook: unit tests plus the
      # local CardDAV servers the fixtures launch (Radicale/Xandikos). The
      # `remote` marker is excluded so no credentials or network are needed.
      - name: Run tests
        run: uv run pytest -q -m "not remote"
