[project]
name = "carddav"
version = "0.2.0"
description = "A minimal, dependency-light CardDAV client library for Python"
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "XMyFun" }]
keywords = ["carddav", "webdav", "vcard", "contacts", "addressbook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email :: Address Book",
    "Typing :: Typed",
]

[project.optional-dependencies]

[project.urls]
Homepage = "https://github.com/xmyfun/python-carddav"
Repository = "https://github.com/xmyfun/python-carddav"
Issues = "https://github.com/xmyfun/python-carddav/issues"
Changelog = "https://github.com/xmyfun/python-carddav/blob/main/CHANGELOG.md"
Documentation = "https://github.com/xmyfun/python-carddav/tree/main/docs"

[project.scripts]
carddav = "carddav.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-requests>=2.33.0.20261006",
    "vermin>=1.9.2",
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
