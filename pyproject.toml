[project]
name = "carddav"
version = "0.3.0"
description = "A minimal, dependency-light CardDAV client library for Python"
readme = "README.md"
requires-python = ">=3.10"           # Set 2026-10-28; 3.10 is EOL, best-effort only (sunset clause in docs/README)
license = "Apache-2.0"              # PEP 639 SPDX expression (set 2026-10-28)
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "XMyFun" }]
keywords = ["carddav", "webdav", "vcard", "contacts", "addressbook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Email :: Address Book",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1"]  # Only runtime dependency; HTTP/1.1 covers CardDAV over HTTPS

[project.optional-dependencies]
requests = ["requests>=2.32.4"]  # Optional backend: backend="requests" (2.32.4 = CVE-2024-47081 fix)

[project.urls]
Homepage = "https://github.com/xmyfun/python-carddav"
Repository = "https://github.com/xmyfun/python-carddav"
Issues = "https://github.com/xmyfun/python-carddav/issues"
Changelog = "https://github.com/xmyfun/python-carddav/blob/main/CHANGELOG.md"
Documentation = "https://github.com/xmyfun/python-carddav/tree/main/docs"

[project.scripts]
carddav = "carddav.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=3.8,<4",          # 4.x requires Python>=3.11, conflicts with requires-python>=3.10
    "pytest>=9.2.0",
    "requests>=2.32.4",           # Only for testing the optional backend
    "ruff>=0.17.3",
    "types-requests>=2.33.0.20261006",
    "vermin>=1.9.2",
    # Local live-test targets. PEP 735 dependency groups are NOT published to PyPI
    # (only [project.optional-dependencies] are) - end users never see these.
    "radicale>=3.9.0",            # Self-hosted CardDAV target for tests/integration (random port + temp dir).
    "xandikos>=0.4.10",           # Self-hosted CardDAV target for tests/integration (serve --defaults --autocreate).
]

# ---- Tool config (min Python 3.10, aligned with internal/05 §15) ----

[tool.ruff]
target-version = "py310"            # No autofix suggestions that only exist on 3.11+
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"             # Analyze against 3.10's typeshed and syntax (internal/05 §15)
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No default addopts: every collected item runs. A remote server is only added to
# the catalog when servers.ini configures it, and each one skips itself when its
# credentials are incomplete or the host is unreachable - so a bare ``pytest`` is
# still green without credentials, with no CLI flag to remember.
markers = [
    "local: label on test items parametrized with a local test server (Radicale/Xandikos) launched by the fixtures and destroyed at session end - a disposable sandbox, always writable. Filtering label only - it never gates execution",
    "remote: label on test items parametrized with a remote real server configured in tests/integration/servers.ini (public cloud, LAN or localhost - anything that exists outside the test run and may hold real data). Filtering label only - it never gates execution; write tests additionally require --allow-write",
]
